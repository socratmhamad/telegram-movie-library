<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100%" height="100%">
  <defs>
    <!-- مسار شكل البرق الأصلي -->
    <path id="lightning-shape" d="M30,3 L96,3 L54,42 L88,42 L8,107 L36,54 L8,54 Z" />

    <!-- قناع لحصر كل تفاصيل الأفلام داخل شكل البرق -->
    <clipPath id="lightning-clip">
      <use href="#lightning-shape" />
    </clipPath>

    <!-- خلفية تدرج سينمائي عميق -->
    <linearGradient id="cinema-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b0036" />
      <stop offset="45%" stop-color="#4c1d95" />
      <stop offset="75%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>

    <!-- تدرج لإشعاع البروجكتر السينمائي -->
    <linearGradient id="projector-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8b4fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- تدرج الإطار اللامع الخارجي -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- ظل وتوهج ناعم -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#7e22ce" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- توهج خفيف خلف الشعار -->
  <use href="#lightning-shape" fill="none" stroke="#9333ea" stroke-width="6" opacity="0.3" filter="url(#soft-glow)" />

  <!-- محتوى الشعار المحصور داخل القناع -->
  <g clip-path="url(#lightning-clip)">
    <!-- السماء/الخلفية السينمائية الليلية -->
    <rect x="0" y="0" width="100" height="110" fill="url(#cinema-sky)" />

    <!-- شعاع بروجكتر الضوء المسرحي -->
    <polygon points="10,105 90,10 40,0" fill="url(#projector-glow)" />

    <!-- بكرة الفيلم السينمائي (Film Reel) في القسم العلوي -->
    <g transform="translate(62, 22) scale(0.65)" opacity="0.35">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#f3e8ff" stroke-width="3.5" />
      <circle cx="0" cy="0" r="6" fill="#f3e8ff" />
      <circle cx="0" cy="-11" r="3" fill="#f3e8ff" />
      <circle cx="0" cy="11" r="3" fill="#f3e8ff" />
      <circle cx="-11" cy="0" r="3" fill="#f3e8ff" />
      <circle cx="11" cy="0" r="3" fill="#f3e8ff" />
    </g>

    <!-- شريط سينمائي عمودي (Film Strip) في المنتصف -->
    <g transform="rotate(-28, 48, 55)" opacity="0.28">
      <!-- خطوط الشريط الخارجي -->
      <rect x="36" y="-10" width="26" height="130" fill="none" stroke="#fff" stroke-width="1.8" />
      <!-- ثقوب شريط الفيلم السينمائي اليمنى واليسرى -->
      <g fill="#fff">
        <rect x="38" y="0" width="3" height="4.5" rx="1" />
        <rect x="38" y="10" width="3" height="4.5" rx="1" />
        <rect x="38" y="20" width="3" height="4.5" rx="1" />
        <rect x="38" y="30" width="3" height="4.5" rx="1" />
        <rect x="38" y="40" width="3" height="4.5" rx="1" />
        <rect x="38" y="50" width="3" height="4.5" rx="1" />
        <rect x="38" y="60" width="3" height="4.5" rx="1" />
        <rect x="38" y="70" width="3" height="4.5" rx="1" />
        <rect x="38" y="80" width="3" height="4.5" rx="1" />
        <rect x="38" y="90" width="3" height="4.5" rx="1" />
        <rect x="38" y="100" width="3" height="4.5" rx="1" />

        <rect x="57" y="0" width="3" height="4.5" rx="1" />
        <rect x="57" y="10" width="3" height="4.5" rx="1" />
        <rect x="57" y="20" width="3" height="4.5" rx="1" />
        <rect x="57" y="30" width="3" height="4.5" rx="1" />
        <rect x="57" y="40" width="3" height="4.5" rx="1" />
        <rect x="57" y="50" width="3" height="4.5" rx="1" />
        <rect x="57" y="60" width="3" height="4.5" rx="1" />
        <rect x="57" y="70" width="3" height="4.5" rx="1" />
        <rect x="57" y="80" width="3" height="4.5" rx="1" />
        <rect x="57" y="90" width="3" height="4.5" rx="1" />
        <rect x="57" y="100" width="3" height="4.5" rx="1" />
      </g>
    </g>

    <!-- أضواء ونجوم سينمائية لامعة متناثرة في الأفق -->
    <circle cx="50" cy="18" r="1.5" fill="#fff" opacity="0.9" />
    <circle cx="75" cy="38" r="1.2" fill="#38bdf8" opacity="0.8" />
    <circle cx="28" cy="45" r="1.4" fill="#fff" opacity="0.7" />
    <circle cx="62" cy="70" r="1.6" fill="#f472b6" opacity="0.8" />
    <circle cx="42" cy="82" r="1.2" fill="#fff" opacity="0.9" />
    <circle cx="20" cy="92" r="1.5" fill="#38bdf8" opacity="0.75" />

    <!-- إطار داخلي خفيف يحدد الأبعاد ويعطي عمق 3D -->
    <use href="#lightning-shape" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  </g>

  <!-- الإطار الخارجي المتوهج مثل إطار أيقونة التلغرام الأنيق -->
  <use href="#lightning-shape" fill="none" stroke="url(#border-glow)" stroke-width="3" stroke-linejoin="round" />
</svg>